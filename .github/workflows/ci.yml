name: CI

# Each job runs on a pull request only when files it depends on changed, and
# on every push to main. The gating is a job-level `if:` on the `changes` job's
# outputs, never workflow-level `paths:`: a skipped job reports as passing, so a
# required check never waits for a run that didn't start. A job that starts
# depending on files elsewhere (the core embeds skills/ through include_str!)
# adds them to its pattern below.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      macos: ${{ steps.filter.outputs.macos }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      # A pull request checks out its merge into the base: the first parent is
      # the base, so the diff is what merging would change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        env:
          CORE: '^(core/|skills/|\.github/workflows/ci\.yml$)'
          MACOS: '^(apps/macos/|scripts/build-core\.sh$)'
          DESKTOP: '^(apps/desktop/|scripts/(test-updater-scripts|updater-manifest|appcast|sparkle-public-key)\.sh$)'
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=everything
          fi
          echo "$files"
          changed() { [[ $files == everything ]] || grep -qE "$1" <<<"$files"; }
          {
            changed "$CORE" && echo core=true || echo core=false
            changed "$CORE|$MACOS" && echo macos=true || echo macos=false
            changed "$CORE|$DESKTOP" && echo desktop=true || echo desktop=false
          } | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Rust core (Linux)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    # A hung test fails the job instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The Windows app links the core. Checked here rather than on a
      # Windows runner: clippy doesn't link, so it needs no Windows toolchain.
      - name: Clippy for Windows
        run: cargo clippy -p localhost-core -p localhost-cli --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Rust core (Windows)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    # A hung test fails the job instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # The real-process fixtures are Python scripts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The tests that run natively on Windows, against real processes.
      - run: cargo test -p localhost-core --lib --test process_tree_windows --test detection --test ports --test dependencies --test run_stats --test shared --test agents --no-run
      - run: cargo test -p localhost-core --lib --test process_tree_windows --test detection --test ports --test dependencies --test run_stats --test shared --test agents
        timeout-minutes: 5
      # The shared core on its named pipe, driven by `localhost mcp` and an app at once.
      - run: cargo test -p localhost-cli --test mcp
        timeout-minutes: 5

  macos:
    name: Rust core and app (macOS)
    needs: changes
    if: needs.changes.outputs.macos == 'true' && (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: macos-26
    # A hung test fails the job instead of holding the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: xcodebuild -version
      # Clippy again, for the code behind cfg(target_os = "macos").
      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: Test the core
        working-directory: core
        run: cargo test
      # The scheme's pre-action builds it too, but hides the output.
      - name: Build the core library and the Swift bindings
        run: scripts/build-core.sh debug
      - run: scripts/build-core.sh --check
      - name: Test the Swift layer
        working-directory: apps/macos/LocalhostCoreFFI
        run: swift test
      - name: Build the app (unsigned)
        run: >
          xcodebuild -project apps/macos/localhost.xcodeproj -scheme localhost
          -configuration Debug -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build

  desktop:
    name: Desktop app (Linux)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # The oldest Ubuntu the packages target.
    runs-on: ubuntu-22.04
    # A hung test fails the job instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install the webview and tray libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # What the release workflow writes the update feeds with, on throwaway keys.
      - name: Test the updater scripts
        run: ../../scripts/test-updater-scripts.sh
      # The Rust build embeds dist/.
      - run: pnpm build
      - name: Rust
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Check the TypeScript bindings are up to date
        run: git diff --exit-code src/bindings.ts

  # One check that stands for the whole workflow, for a ruleset to require:
  # skipped jobs pass, failed or cancelled ones (the change detection too) fail it.
  result:
    name: CI result
    if: always()
    needs: [changes, linux, windows, macos, desktop]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]
