name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  rust-core-for-app:
    name: Rust core for the app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the universal library and the Swift bindings
        run: scripts/build-core.sh release
      - run: scripts/build-core.sh --check
      - name: Type-check the Swift bindings
        run: >
          swiftc -typecheck -module-name LocalhostCore
          -I Packages/LocalhostCoreFFI/Generated/LocalhostCoreFFI.xcframework/macos-arm64_x86_64/Headers
          Packages/LocalhostCoreFFI/Sources/LocalhostCore/Generated/LocalhostCore+FFI.swift

  core:
    name: Core tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test LocalhostCore
        working-directory: Packages/LocalhostCore
        run: swift test

  app:
    name: App build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build (unsigned)
        run: >
          xcodebuild -project localhost.xcodeproj -scheme localhost
          -configuration Debug -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
