<!-- The Windows installer's header image, at the left of the other pages' white
     header (150×57, tauri.windows.conf.json). Exported as header.bmp,
     24-bit. -->
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="57" viewBox="0 0 150 57">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E36"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
  </defs>
  <rect width="150" height="57" fill="#FFFFFF"/>
  <!-- The app icon, small. -->
  <rect x="12" y="10" width="37" height="37" rx="9" fill="url(#fill)"/>
  <rect x="26.5" y="18" width="8" height="8" rx="2.5" fill="#FF5C8A"/>
  <rect x="26.5" y="31" width="8" height="8" rx="2.5" fill="#FF5C8A"/>
  <text x="58" y="34" fill="#1C1C21"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="17" font-weight="600">localhost</text>
</svg>
