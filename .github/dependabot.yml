# Weekly, one grouped PR per ecosystem, so updates stay reviewable. New
# dependencies still need an issue first (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/core", "/apps/desktop/src-tauri"]
    schedule:
      interval: weekly
    # Pinned to exact release candidates that only work together, and bumped one
    # directory at a time they don't resolve. Moved together by hand.
    ignore:
      - dependency-name: specta
      - dependency-name: specta-typescript
      - dependency-name: tauri-specta
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Its tag is the Rust version to install, which Dependabot bumps to ones that
    # don't exist. Rust is updated by hand.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
