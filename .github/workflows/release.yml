name: Release

# A v* tag builds the macOS DMG and the Linux packages (.deb, .rpm, AppImage)
# and drafts one GitHub Release with all of them; publishing the draft is the
# maintainer's step. See RELEASING.md.
#
# Signing follows the secrets that exist:
#   Developer ID   DEVELOPER_ID_CERTIFICATE_P12, DEVELOPER_ID_CERTIFICATE_PASSWORD,
#                  NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER_ID → signed, notarized, stapled
#   self-signed    SIGNING_CERTIFICATE_P12, SIGNING_CERTIFICATE_PASSWORD
#   ad hoc         neither

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Read the version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: Build the macOS DMG
    needs: version
    runs-on: macos-26
    outputs:
      mode: ${{ steps.signing.outputs.mode }}
    env:
      DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: xcodebuild -version

      - name: Choose the signing mode
        id: signing
        run: |
          if [[ -n $DEVELOPER_ID_CERTIFICATE_P12 && -n $DEVELOPER_ID_CERTIFICATE_PASSWORD &&
                -n $NOTARY_KEY_P8 && -n $NOTARY_KEY_ID && -n $NOTARY_ISSUER_ID ]]; then
            mode=developer-id
          elif [[ -n $SIGNING_CERTIFICATE_P12 && -n $SIGNING_CERTIFICATE_PASSWORD ]]; then
            mode=self-signed
          else
            mode=ad-hoc
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Signing: $mode"

      # A throwaway keychain on the search list, where codesign finds the identity.
      - name: Import the signing certificate
        id: identity
        if: steps.signing.outputs.mode != 'ad-hoc'
        run: |
          if [[ ${{ steps.signing.outputs.mode }} == developer-id ]]; then
            p12=$DEVELOPER_ID_CERTIFICATE_P12 password=$DEVELOPER_ID_CERTIFICATE_PASSWORD
          else
            p12=$SIGNING_CERTIFICATE_P12 password=$SIGNING_CERTIFICATE_PASSWORD
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$p12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word; the runner's paths have no spaces
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # By SHA-1, so the choice is unambiguous. A self-signed certificate isn't
          # trusted ("CSSMERR_TP_NOT_TRUSTED"), which codesign accepts.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ {print $2; exit}')
          if [[ -z $identity ]]; then
            echo "::error::No code signing identity in the certificate secret"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build, sign and pack the DMG
        id: build
        env:
          SIGNING_IDENTITY: ${{ steps.identity.outputs.identity || '-' }}
          DEVELOPER_ID: ${{ steps.signing.outputs.mode == 'developer-id' && '1' || '' }}
        run: |
          dmg=$(scripts/build-release.sh "${{ needs.version.outputs.version }}" "$GITHUB_RUN_NUMBER" | tail -1)
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          DMG: ${{ steps.build.outputs.dmg }}
        run: |
          key=$RUNNER_TEMP/notary-key.p8
          echo "$NOTARY_KEY_P8" | base64 --decode > "$key"
          xcrun notarytool submit "$DMG" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          if [[ $status != Accepted ]]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" \
              --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
            echo "::error::Notarization ended as $status"
            exit 1
          fi
          rm "$key"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Checksum
        env:
          DMG: ${{ steps.build.outputs.dmg }}
        run: cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            ${{ steps.build.outputs.dmg }}
            ${{ steps.build.outputs.dmg }}.sha256
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && steps.identity.outcome != 'skipped'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  linux:
    name: Build the Linux packages
    needs: version
    # The oldest Ubuntu the packages support: they need its glibc or newer.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      # With the AppIndicator library installed, the bundler adds the tray,
      # webview and GTK libraries to the packages' dependencies itself.
      - name: Install the webview and tray libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@1.90
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Build the .deb, .rpm and AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: pnpm tauri build --bundles deb,rpm,appimage --config "{\"version\":\"$VERSION\"}"

      - name: Collect and checksum
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage "$RUNNER_TEMP/linux/"
          cd "$RUNNER_TEMP/linux"
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ runner.temp }}/linux/*
          if-no-files-found: error

  draft:
    name: Draft the GitHub Release
    needs: [version, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          MODE: ${{ needs.macos.outputs.mode }}
        run: |
          case $MODE in
            developer-id) install="Signed with Developer ID and notarized by Apple." ;;
            self-signed) install="Not notarized: the first launch needs **Open Anyway** in System Settings → Privacy & Security, see [First launch](${{ github.server_url }}/${{ github.repository }}#first-launch-of-a-build-that-isnt-notarized) in the README." ;;
            ad-hoc) install="Signed ad hoc and not notarized: the first launch needs **Open Anyway** in System Settings → Privacy & Security, and macOS asks again for Keychain access to each Secret after every update, see [the README](${{ github.server_url }}/${{ github.repository }}#install)." ;;
          esac
          linux="**Linux** (x86_64): the \`.deb\` (Ubuntu 22.04 or later, Debian 12), the \`.rpm\` (Fedora) or the AppImage; not signed. Secrets need a Secret Service (GNOME Keyring, KWallet) and the tray on GNOME needs the AppIndicator extension, see [Linux](${{ github.server_url }}/${{ github.repository }}#linux) in the README."
          notes=$(printf '**macOS**: requires macOS 15 or later. %s\n\n%s' "$install" "$linux")
          gh release create "$GITHUB_REF_NAME" assets/* \
            --draft --verify-tag --title "localhost $VERSION" \
            --notes "$notes" --generate-notes

