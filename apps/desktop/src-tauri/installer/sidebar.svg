<!-- The Windows installer's sidebar, on its Welcome and Finish pages (164×314,
     tauri.windows.conf.json). Exported as sidebar.bmp, 24-bit. -->
<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E36"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
  </defs>
  <rect width="164" height="314" fill="url(#fill)"/>
  <!-- The app icon's colon. -->
  <rect x="66" y="92" width="32" height="32" rx="10" fill="#FF5C8A"/>
  <rect x="66" y="152" width="32" height="32" rx="10" fill="#FF5C8A"/>
  <text x="82" y="236" text-anchor="middle" fill="#F2F2F5"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="20" font-weight="600">localhost</text>
</svg>
