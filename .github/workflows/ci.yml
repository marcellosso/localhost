name: CI

# macOS minutes are the expensive ones, so:
# - Linux does fmt and runs on every push, drafts included.
# - One macOS job does the rest, and skips draft pull requests. Marking a
#   pull request ready for review runs it.
# - The universal release library is left to the release workflow; CI builds
#   the core for this Mac only.
# - Changes to Markdown and docs/ alone run nothing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Rust core (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  macos:
    name: Rust core and app (macOS)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: xcodebuild -version
      # Clippy again, for the code behind cfg(target_os = "macos").
      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: Test the core
        working-directory: core
        run: cargo test
      # The scheme's pre-action builds it too, but hides the output.
      - name: Build the core library and the Swift bindings
        run: scripts/build-core.sh debug
      - run: scripts/build-core.sh --check
      - name: Test the Swift layer
        working-directory: Packages/LocalhostCoreFFI
        run: swift test
      - name: Build the app (unsigned)
        run: >
          xcodebuild -project localhost.xcodeproj -scheme localhost
          -configuration Debug -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
