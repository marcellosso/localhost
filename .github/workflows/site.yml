name: Site

# Checks that the website in site/ builds. It reads the Project file reference
# from docs/, the screenshots from .github/assets/ and the colours from the
# desktop app's tokens, so changes there are checked too. Publishing is done by
# Vercel, which builds site/ itself on every push to main. The download links
# are read from the latest release at build time, so publishing a release asks
# Vercel for a fresh build through its deploy hook.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [site/**, docs/**, .github/assets/**, apps/desktop/src/styles/tokens.css, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, docs/**, .github/assets/**, apps/desktop/src/styles/tokens.css, .github/workflows/site.yml]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: Rebuild the site for the new release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel's deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [[ -z $VERCEL_DEPLOY_HOOK ]]; then
            echo "::error::No VERCEL_DEPLOY_HOOK secret: the site keeps the previous release's version and download links until it is rebuilt. Add the secret and re-run this job."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$VERCEL_DEPLOY_HOOK"
