name: Feature request
description: Something localhost could do that it doesn't yet.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead
      description: Workarounds, or other tools you use for this.
