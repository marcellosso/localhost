name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Rust core (Linux)
    runs-on: ubuntu-latest
    # A hung test fails the job instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The Windows app links the core (XP4). Checked here rather than on a
      # Windows runner: clippy doesn't link, so it needs no Windows toolchain.
      - name: Clippy for Windows
        run: cargo clippy -p localhost-core --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Rust core (Windows)
    runs-on: windows-latest
    # A hung test fails the job instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # The real-process fixtures are Python scripts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Native execution (XP5): the tests ported so far, against real processes.
      - run: cargo test -p localhost-core --lib --test process_tree_windows --test windows_diagnostics --no-run
      # Temporary: what Windows itself does, for diagnosing the tests below.
      - run: cargo test -p localhost-core --test windows_diagnostics -- --nocapture
        timeout-minutes: 2
      - run: cargo test -p localhost-core --lib --test process_tree_windows
        timeout-minutes: 5

  macos:
    name: Rust core and app (macOS)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: macos-26
    # A hung test fails the job instead of holding the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: xcodebuild -version
      # Clippy again, for the code behind cfg(target_os = "macos").
      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: Test the core
        working-directory: core
        run: cargo test
      # The scheme's pre-action builds it too, but hides the output.
      - name: Build the core library and the Swift bindings
        run: scripts/build-core.sh debug
      - run: scripts/build-core.sh --check
      - name: Test the Swift layer
        working-directory: apps/macos/LocalhostCoreFFI
        run: swift test
      - name: Build the app (unsigned)
        run: >
          xcodebuild -project apps/macos/localhost.xcodeproj -scheme localhost
          -configuration Debug -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build

  desktop:
    name: Desktop app (Linux)
    # The oldest Ubuntu the packages target (#48).
    runs-on: ubuntu-22.04
    # A hung test fails the job instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install the webview and tray libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The Rust build embeds dist/.
      - run: pnpm build
      - name: Rust
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Check the TypeScript bindings are up to date
        run: git diff --exit-code src/bindings.ts
