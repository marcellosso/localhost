name: Release

# A v* tag builds the macOS DMG, the Linux packages (.deb, .rpm, AppImage) and
# the Windows installer (with localhostd for WSL inside), and drafts one GitHub
# Release with all of them; publishing the draft is the maintainer's step.
# Each app bundles the `localhost` command of the same commit, which coding
# agents run as their MCP server: in the macOS app's Contents/Helpers, as
# /usr/bin/localhost in the Linux packages, beside localhost-app.exe on
# Windows. It reports the release's version. See RELEASING.md.
#
# macOS signing follows the secrets that exist:
#   Developer ID   DEVELOPER_ID_CERTIFICATE_P12, DEVELOPER_ID_CERTIFICATE_PASSWORD,
#                  NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER_ID → signed, notarized, stapled
#   self-signed    SIGNING_CERTIFICATE_P12, SIGNING_CERTIFICATE_PASSWORD
#   ad hoc         neither
# Windows: Authenticode with WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD,
# unsigned without them.
#
# Updates: every package is also signed with the updater's keys, and the release
# carries latest.json (Linux, Windows) and appcast.xml (macOS), which installed
# apps check. These need, and the release fails without:
#   secrets    TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, SPARKLE_PRIVATE_KEY
#   variables  TAURI_UPDATER_PUBLIC_KEY, SPARKLE_PUBLIC_KEY
# scripts/create-updater-keys.sh makes them; see RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Read the version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_url: ${{ steps.version.outputs.release_url }}
    steps:
      # A release without signed updates would leave every user of it on that
      # version for good, so none is built without the keys.
      - name: Check the updater keys
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          missing=()
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD SPARKLE_PRIVATE_KEY \
            TAURI_UPDATER_PUBLIC_KEY SPARKLE_PUBLIC_KEY; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing the updater keys: ${missing[*]}. Create them once with scripts/create-updater-keys.sh, see RELEASING.md (Updates)."
            exit 1
          fi
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  macos:
    name: Build the macOS DMG
    needs: version
    runs-on: macos-26
    outputs:
      mode: ${{ steps.signing.outputs.mode }}
    env:
      DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      # Sparkle's command-line tools, for signing the update; the app gets the
      # same version through Swift Package Manager.
      SPARKLE_VERSION: 2.10.1
      SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: xcodebuild -version

      - name: Choose the signing mode
        id: signing
        run: |
          if [[ -n $DEVELOPER_ID_CERTIFICATE_P12 && -n $DEVELOPER_ID_CERTIFICATE_PASSWORD &&
                -n $NOTARY_KEY_P8 && -n $NOTARY_KEY_ID && -n $NOTARY_ISSUER_ID ]]; then
            mode=developer-id
          elif [[ -n $SIGNING_CERTIFICATE_P12 && -n $SIGNING_CERTIFICATE_PASSWORD ]]; then
            mode=self-signed
          else
            mode=ad-hoc
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Signing: $mode"

      # A throwaway keychain on the search list, where codesign finds the identity.
      - name: Import the signing certificate
        id: identity
        if: steps.signing.outputs.mode != 'ad-hoc'
        run: |
          if [[ ${{ steps.signing.outputs.mode }} == developer-id ]]; then
            p12=$DEVELOPER_ID_CERTIFICATE_P12 password=$DEVELOPER_ID_CERTIFICATE_PASSWORD
          else
            p12=$SIGNING_CERTIFICATE_P12 password=$SIGNING_CERTIFICATE_PASSWORD
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$p12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word; the runner's paths have no spaces
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # By SHA-1, so the choice is unambiguous. A self-signed certificate isn't
          # trusted ("CSSMERR_TP_NOT_TRUSTED"), which codesign accepts.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ {print $2; exit}')
          if [[ -z $identity ]]; then
            echo "::error::No code signing identity in the certificate secret"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build, sign and pack the DMG
        id: build
        env:
          SIGNING_IDENTITY: ${{ steps.identity.outputs.identity || '-' }}
          DEVELOPER_ID: ${{ steps.signing.outputs.mode == 'developer-id' && '1' || '' }}
          FEED_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/appcast.xml
        run: |
          dmg=$(scripts/build-release.sh "${{ needs.version.outputs.version }}" "$GITHUB_RUN_NUMBER" | tail -1)
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          DMG: ${{ steps.build.outputs.dmg }}
        run: |
          key=$RUNNER_TEMP/notary-key.p8
          echo "$NOTARY_KEY_P8" | base64 --decode > "$key"
          xcrun notarytool submit "$DMG" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          if [[ $status != Accepted ]]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" \
              --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
            echo "::error::Notarization ended as $status"
            exit 1
          fi
          rm "$key"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Checksum
        env:
          DMG: ${{ steps.build.outputs.dmg }}
        run: cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256"

      # After notarization, which staples a ticket into the DMG.
      - name: Sign the update and write the appcast
        id: appcast
        env:
          DMG: ${{ steps.build.outputs.dmg }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_URL: ${{ needs.version.outputs.release_url }}
        run: |
          tools=$RUNNER_TEMP/sparkle
          mkdir -p "$tools"
          curl -fsSL -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $tools/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$tools/sparkle.tar.xz" -C "$tools" ./bin/sign_update
          derived=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | scripts/sparkle-public-key.sh)
          if [[ $derived != "$SPARKLE_PUBLIC_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY isn't the private half of SPARKLE_PUBLIC_KEY: installed apps would reject this update."
            exit 1
          fi
          signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tools/bin/sign_update" --ed-key-file - -p "$DMG")
          appcast=$(dirname "$DMG")/appcast.xml
          scripts/appcast.sh "$DMG" "$VERSION" "$GITHUB_RUN_NUMBER" "$signature" "$RELEASE_URL" > "$appcast"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tools/bin/sign_update" --ed-key-file - "$appcast"
          cat "$appcast"
          echo "path=$appcast" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            ${{ steps.build.outputs.dmg }}
            ${{ steps.build.outputs.dmg }}.sha256
            ${{ steps.appcast.outputs.path }}
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && steps.identity.outcome != 'skipped'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  linux:
    name: Build the Linux packages
    needs: version
    # The oldest Ubuntu the packages support: they need its glibc or newer.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      # With the AppIndicator library installed, the bundler adds the tray,
      # webview and GTK libraries to the packages' dependencies itself.
      - name: Install the webview and tray libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm cpio
      - uses: dtolnay/rust-toolchain@1.90
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Bundled as a sidecar (bundle.externalBin), named for its target as Tauri expects.
      - name: Build the localhost command
        env:
          LOCALHOST_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo build --manifest-path ../../core/Cargo.toml -p localhost-cli --bin localhost --release
          target=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          cp ../../core/target/release/localhost "src-tauri/binaries/localhost-$target"
          version=$("src-tauri/binaries/localhost-$target" --version)
          if [[ $version != "localhost $LOCALHOST_VERSION" ]]; then
            echo "::error::The localhost command says '$version', not 'localhost $LOCALHOST_VERSION'"
            exit 1
          fi

      # Signed for the updater too (each package gets a .sig), with the public
      # key and the feed of this repository built in.
      - name: Build the .deb, .rpm and AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LOCALHOST_VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          FEED_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          config=$(jq -nc --arg version "$VERSION" --arg key "$PUBLIC_KEY" --arg feed "$FEED_URL" '
            {version: $version, bundle: {createUpdaterArtifacts: true, externalBin: ["binaries/localhost"]},
             plugins: {updater: {pubkey: $key, endpoints: [$feed]}}}')
          pnpm tauri build --bundles deb,rpm,appimage --config "$config"

      # Each package unpacked: usr/bin/localhost is there, runs, and says this version.
      - name: Check the localhost command in every package
        run: ../../scripts/check-linux-packages.sh src-tauri/target/release/bundle "${{ needs.version.outputs.version }}"

      - name: Collect and checksum
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/linux" "$RUNNER_TEMP/signatures"
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage "$RUNNER_TEMP/linux/"
          for package in "$RUNNER_TEMP"/linux/*; do
            built=$(find src-tauri/target/release/bundle -name "$(basename "$package").sig" | head -1)
            # The bundler signs what the updater installs; the .deb and .rpm are signed here if it didn't.
            if [[ -z $built ]]; then
              pnpm tauri signer sign --app-version "$VERSION" "$package"
              built=$package.sig
            fi
            mv "$built" "$RUNNER_TEMP/signatures/$(basename "$package").sig"
          done
          cd "$RUNNER_TEMP/linux"
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -l . "$RUNNER_TEMP/signatures"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ runner.temp }}/linux/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: signatures-linux
          path: ${{ runner.temp }}/signatures/*
          if-no-files-found: error

  localhostd:
    name: Build localhostd for WSL
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Static, so it runs in any distro whatever its glibc.
      - name: Build localhostd (static, musl)
        env:
          LOCALHOST_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build -p localhost-daemon --release --target x86_64-unknown-linux-musl
      - name: Check that it is static and runs
        run: |
          binary=target/x86_64-unknown-linux-musl/release/localhostd
          file "$binary"
          # Older `file` says "statically linked", newer "static-pie linked".
          file "$binary" | grep -Eq 'statically linked|static-pie linked'
          ls -l "$binary"
          [[ $("$binary" --version) == "localhostd ${{ needs.version.outputs.version }}" ]]
          LOCALHOST_STORAGE_ROOT=$(mktemp -d) "$binary" --stdio < /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: localhostd
          path: core/target/x86_64-unknown-linux-musl/release/localhostd
          if-no-files-found: error

  windows:
    name: Build the Windows installer
    needs: [version, localhostd]
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.certificate.outcome == 'success' }}
    env:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Installed beside localhost-app.exe, where the app looks for it (src-tauri/src/wsl.rs).
      - uses: actions/download-artifact@v4
        with:
          name: localhostd
          path: apps/desktop/src-tauri/wsl

      # Into the runner's certificate store, where signtool finds it by thumbprint.
      - name: Import the code signing certificate
        id: certificate
        if: env.WINDOWS_CERTIFICATE_PFX != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          if (-not $certificate.HasPrivateKey) { Write-Error "The certificate secret has no private key"; exit 1 }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      # Bundled as a sidecar (bundle.externalBin), named for its target as Tauri
      # expects; it lands beside localhost-app.exe.
      - name: Build the localhost command
        env:
          LOCALHOST_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo build --manifest-path ../../core/Cargo.toml -p localhost-cli --bin localhost --release
          target=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          mkdir -p src-tauri/binaries
          cp ../../core/target/release/localhost.exe "src-tauri/binaries/localhost-$target.exe"
          version=$("src-tauri/binaries/localhost-$target.exe" --version | tr -d '\r')
          if [[ $version != "localhost $LOCALHOST_VERSION" ]]; then
            echo "::error::The localhost command says '$version', not 'localhost $LOCALHOST_VERSION'"
            exit 1
          fi

      # Before Tauri packs it, with the same certificate as the app.
      - name: Sign the localhost command
        if: steps.certificate.outcome == 'success'
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          $command = (Get-Item src-tauri/binaries/localhost-*.exe).FullName
          & $signtool.FullName sign /sha1 $env:THUMBPRINT /fd sha256 /tr http://timestamp.digicert.com /td sha256 $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Signed for the updater too (a .sig beside the installer), with the
      # public key and the feed of this repository built in.
      - name: Build the installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LOCALHOST_VERSION: ${{ needs.version.outputs.version }}
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          FEED_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          config=$(jq -nc --arg version "$VERSION" --arg thumbprint "$THUMBPRINT" --arg key "$PUBLIC_KEY" --arg feed "$FEED_URL" '
            {version: $version, bundle: {resources: {"wsl/localhostd": "localhostd"}, externalBin: ["binaries/localhost"],
                                         createUpdaterArtifacts: true},
             plugins: {updater: {pubkey: $key, endpoints: [$feed]}}}
            * if $thumbprint == "" then {} else {bundle: {windows: {certificateThumbprint: $thumbprint}}} end')
          pnpm tauri build --bundles nsis --config "$config"

      - name: Check the signature
        if: steps.certificate.outcome == 'success'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) +
            @(Get-Item src-tauri/target/release/localhost-app.exe) + @(Get-Item src-tauri/binaries/localhost-*.exe)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            "$($file.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
            if (-not $signature.SignerCertificate) { Write-Error "$($file.Name) isn't signed"; exit 1 }
          }

      - name: Collect and checksum
        run: |
          mkdir -p "$RUNNER_TEMP/windows" "$RUNNER_TEMP/signatures"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "$RUNNER_TEMP/windows/"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig "$RUNNER_TEMP/signatures/"
          cd "$RUNNER_TEMP/windows"
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -l . "$RUNNER_TEMP/signatures"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/windows/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: signatures-windows
          path: ${{ runner.temp }}/signatures/*
          if-no-files-found: error

      - name: Remove the signing certificate
        if: always() && steps.certificate.outcome == 'success'
        shell: pwsh
        run: Remove-Item "Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}" -DeleteKey

  draft:
    name: Draft the GitHub Release
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      # For scripts/updater-manifest.sh.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The packages' signatures go into latest.json, not the release.
      - name: Write latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_URL: ${{ needs.version.outputs.release_url }}
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          scripts/updater-manifest.sh assets "$VERSION" "$RELEASE_URL" "$PUBLIC_KEY" > latest.json
          rm assets/*.sig
          mv latest.json assets/
          cat assets/latest.json
          ls -l assets

      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          MODE: ${{ needs.macos.outputs.mode }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          case $MODE in
            developer-id) install="Signed with Developer ID and notarized by Apple." ;;
            self-signed) install="Not notarized: the first launch needs **Open Anyway** in System Settings → Privacy & Security, see [First launch](${{ github.server_url }}/${{ github.repository }}#macos-a-build-that-isnt-notarized) in the README." ;;
            ad-hoc) install="Signed ad hoc and not notarized: the first launch needs **Open Anyway** in System Settings → Privacy & Security, and macOS asks again for Keychain access to each Secret after every update, see [the README](${{ github.server_url }}/${{ github.repository }}#install)." ;;
          esac
          linux="**Linux** (x86_64): the \`.deb\` (Ubuntu 22.04 or later, Debian 12), the \`.rpm\` (Fedora) or the AppImage; not signed. Secrets need a Secret Service (GNOME Keyring, KWallet) and the tray on GNOME needs the AppIndicator extension, see [Linux](${{ github.server_url }}/${{ github.repository }}#linux-a-secret-service) in the README."
          if [[ $WINDOWS_SIGNED == true ]]; then windows_signing="Signed."; else
            windows_signing="Not signed: SmartScreen asks first, see [Windows](${{ github.server_url }}/${{ github.repository }}#windows-smartscreen) in the README."; fi
          windows="**Windows** (x64): \`localhost_${VERSION}_x64-setup.exe\`, for Projects in a WSL 2 distro. $windows_signing"
          notes=$(printf '**macOS**: requires macOS 15 or later. %s\n\n%s\n\n%s' "$install" "$linux" "$windows")
          gh release create "$GITHUB_REF_NAME" assets/* \
            --draft --verify-tag --title "localhost $VERSION" \
            --notes "$notes" --generate-notes

