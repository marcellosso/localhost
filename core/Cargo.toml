[workspace]
members = ["localhost-core", "localhost-cli", "localhost-daemon", "localhost-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

# The macOS app links the core statically: whole-program optimisation keeps
# only what the bindings reach.
[profile.release]
lto = true
codegen-units = 1

# Dependencies keep only file and line numbers for backtraces, not full debug
# info: debug builds are much smaller on disk. Our own crates keep full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"
